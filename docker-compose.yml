version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bank-postgres
    environment:
      POSTGRES_DB: bank-app
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    networks:
      - bank-network
    volumes:
      - bank-app-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: bank-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - MY_SECRET_KEY=${MY_SECRET_KEY}
    depends_on:
      - postgres
    networks:
      - bank-network

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: bank-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - bank-network
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:10.1.0
    container_name: bank-grafana
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - bank-network
    depends_on:
      - prometheus

networks:
  bank-network:
    driver: bridge

volumes:
  bank-app-data: